  <!-- Title + tagline -->
  <text x="70" y="210" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" fill="#3D2B1F">Arrow Maze</text>
  <text x="74" y="285" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="600" fill="#6B4E38">Slide the arrows out to clear the board</text>
  <text x="74" y="345" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#C68A2E">300+ levels &#8226; free brain teaser</text>

  <!-- Sliding arrow motif on the right -->
  <g transform="translate(850 250) scale(0.52) translate(-512 -537)">
    <rect x="460" y="470" width="104" height="360" rx="52" fill="#6B4E38"/>
    <rect x="460" y="470" width="104" height="200" rx="52" fill="#3D2B1F"/>
    <polygon points="512,244 683,505 341,505" fill="#3D2B1F"/>
