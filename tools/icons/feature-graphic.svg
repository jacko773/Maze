    <circle cx="60" cy="160" r="6"/><circle cx="160" cy="160" r="6"/><circle cx="260" cy="160" r="6"/><circle cx="360" cy="160" r="6"/><circle cx="460" cy="160" r="6"/><circle cx="560" cy="160" r="6"/><circle cx="660" cy="160" r="6"/><circle cx="760" cy="160" r="6"/><circle cx="860" cy="160" r="6"/><circle cx="960" cy="160" r="6"/>
    <circle cx="60" cy="260" r="6"/><circle cx="160" cy="260" r="6"/><circle cx="260" cy="260" r="6"/><circle cx="360" cy="260" r="6"/><circle cx="460" cy="260" r="6"/><circle cx="560" cy="260" r="6"/><circle cx="660" cy="260" r="6"/><circle cx="760" cy="260" r="6"/><circle cx="860" cy="260" r="6"/><circle cx="960" cy="260" r="6"/>
    <circle cx="60" cy="360" r="6"/><circle cx="160" cy="360" r="6"/><circle cx="260" cy="360" r="6"/><circle cx="360" cy="360" r="6"/><circle cx="460" cy="360" r="6"/><circle cx="560" cy="360" r="6"/><circle cx="660" cy="360" r="6"/><circle cx="760" cy="360" r="6"/><circle cx="860" cy="360" r="6"/><circle cx="960" cy="360" r="6"/>
    <circle cx="60" cy="440" r="6"/><circle cx="160" cy="440" r="6"/><circle cx="260" cy="440" r="6"/><circle cx="360" cy="440" r="6"/><circle cx="460" cy="440" r="6"/><circle cx="560" cy="440" r="6"/><circle cx="660" cy="440" r="6"/><circle cx="760" cy="440" r="6"/><circle cx="860" cy="440" r="6"/><circle cx="960" cy="440" r="6"/>
